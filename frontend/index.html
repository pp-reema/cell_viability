<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Viability Analyzer - Real-Time</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // CONFIGURE YOUR BACKEND URL HERE
        const API_URL = 'https://cell-viability.onrender.com'; 
        // For deployment: const API_URL = 'https://your-app-name.onrender.com';

        const CellViabilityApp = () => {
            const [currentImage, setCurrentImage] = useState(null);
            const [analysisResult, setAnalysisResult] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isCameraMode, setIsCameraMode] = useState(false);
            const [connectedUsers, setConnectedUsers] = useState(1);
            const [lastUpdate, setLastUpdate] = useState(null);
            const [overlayImage, setOverlayImage] = useState(null);
            const [classificationImage, setClassificationImage] = useState(null);
            const [cameraReady, setCameraReady] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            
            // Analysis parameters with defaults
            const [params, setParams] = useState({
                dead_cell_threshold: 0.50,
                min_cell_area: 300,
                max_cell_area: 15000,
                circularity_threshold: 0.25
            });
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);
            const streamRef = useRef(null);

            const storageAvailable = typeof window !== 'undefined' && window.storage;

            // Real-time sync - poll every 2 seconds
            useEffect(() => {
                if (storageAvailable) {
                    loadSharedState();
                    const interval = setInterval(loadSharedState, 2000);
                    return () => clearInterval(interval);
                }
            }, []);

            useEffect(() => {
                return () => {
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const loadSharedState = async () => {
                if (!storageAvailable) return;
                
                try {
                    const result = await window.storage.get('cell-analysis-state', true);
                    if (result && result.value) {
                        const data = JSON.parse(result.value);
                        if (data.timestamp !== lastUpdate) {
                            setCurrentImage(data.currentImage);
                            setAnalysisResult(data.analysisResult);
                            setOverlayImage(data.overlayImage);
                            setClassificationImage(data.classificationImage);
                            setLastUpdate(data.timestamp);
                            setConnectedUsers(data.connectedUsers || 1);
                            
                            // Update params if changed by another user
                            if (data.params) {
                                setParams(data.params);
                            }
                        }
                    }
                } catch (error) {
                    console.log('Loading shared state...');
                }
            };

            const saveSharedState = async (image, result, overlay = null, classification = null) => {
                if (!storageAvailable) return;
                
                try {
                    const data = {
                        currentImage: image,
                        analysisResult: result,
                        overlayImage: overlay,
                        classificationImage: classification,
                        params: params,
                        timestamp: Date.now(),
                        connectedUsers: connectedUsers + 1
                    };
                    await window.storage.set('cell-analysis-state', JSON.stringify(data), true);
                    setLastUpdate(data.timestamp);
                } catch (error) {
                    console.error('Failed to save state:', error);
                }
            };

            const startCamera = async () => {
                try {
                    setCameraReady(false);
                    setIsCameraMode(true);
                    
                    const constraints = {
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    };
                    
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        streamRef.current = stream;
                        
                        videoRef.current.onloadedmetadata = () => {
                            videoRef.current.play();
                            setCameraReady(true);
                        };
                    }
                } catch (error) {
                    console.error('Camera error:', error);
                    alert('Camera access denied or not available. Please enable camera permissions.');
                    setIsCameraMode(false);
                }
            };

            const stopCamera = () => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                    streamRef.current = null;
                }
                if (videoRef.current) {
                    videoRef.current.srcObject = null;
                }
                setIsCameraMode(false);
                setCameraReady(false);
            };

            const captureImage = () => {
                if (!videoRef.current || !canvasRef.current || !cameraReady) {
                    alert('Camera not ready. Please wait a moment.');
                    return;
                }
                
                const canvas = canvasRef.current;
                const video = videoRef.current;
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = canvas.toDataURL('image/png');
                setCurrentImage(imageData);
                stopCamera();
                analyzeImage(imageData);
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const imageData = e.target.result;
                        setCurrentImage(imageData);
                        analyzeImage(imageData);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const analyzeImage = async (imageData) => {
                setIsAnalyzing(true);
                
                try {
                    const response = await fetch(`${API_URL}/analyze`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            image: imageData,
                            method: 'adaptive',
                            include_images: true,
                            parameters: params
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Analysis failed');
                    }

                    const result = await response.json();
                    
                    setAnalysisResult(result.statistics);
                    setOverlayImage(result.overlay_image || null);
                    setClassificationImage(result.classification_image || null);
                    
                    await saveSharedState(
                        imageData, 
                        result.statistics,
                        result.overlay_image,
                        result.classification_image
                    );
                    
                } catch (error) {
                    console.error('Analysis error:', error);
                    alert(`Analysis failed: ${error.message}\n\nPlease check if backend is running at: ${API_URL}`);
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const clearAnalysis = async () => {
                setCurrentImage(null);
                setAnalysisResult(null);
                setOverlayImage(null);
                setClassificationImage(null);
                await saveSharedState(null, null, null, null);
            };

            const downloadResults = () => {
                if (!analysisResult) return;
                
                const data = {
                    ...analysisResult,
                    parameters_used: params,
                    timestamp: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cell-analysis-${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleParamChange = (key, value) => {
                const newParams = { ...params, [key]: parseFloat(value) };
                setParams(newParams);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-800 flex items-center gap-3">
                                        🔬 Cell Viability Analyzer
                                    </h1>
                                    <p className="text-gray-600 mt-1">Real-time synchronized analysis across all devices</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button
                                        onClick={() => setShowSettings(!showSettings)}
                                        className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-semibold transition flex items-center gap-2"
                                    >
                                        ⚙️ Settings
                                    </button>
                                    {storageAvailable && (
                                        <div className="flex items-center gap-2 bg-green-100 px-4 py-2 rounded-full">
                                            <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                            <span className="text-green-700 font-semibold">👥 {connectedUsers} Active</span>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Settings Panel */}
                            {showSettings && (
                                <div className="mt-6 p-6 bg-gray-50 rounded-lg border-2 border-gray-200">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4">Analysis Parameters</h3>
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Dead Cell Threshold (0-1)
                                            </label>
                                            <input
                                                type="number"
                                                step="0.05"
                                                min="0"
                                                max="1"
                                                value={params.dead_cell_threshold}
                                                onChange={(e) => handleParamChange('dead_cell_threshold', e.target.value)}
                                                className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                            />
                                            <p className="text-xs text-gray-500 mt-1">Cells darker than this are considered dead</p>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Minimum Cell Area (pixels)
                                            </label>
                                            <input
                                                type="number"
                                                step="50"
                                                min="50"
                                                max="5000"
                                                value={params.min_cell_area}
                                                onChange={(e) => handleParamChange('min_cell_area', e.target.value)}
                                                className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                            />
                                            <p className="text-xs text-gray-500 mt-1">Minimum size to detect as a cell</p>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Maximum Cell Area (pixels)
                                            </label>
                                            <input
                                                type="number"
                                                step="500"
                                                min="1000"
                                                max="50000"
                                                value={params.max_cell_area}
                                                onChange={(e) => handleParamChange('max_cell_area', e.target.value)}
                                                className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                            />
                                            <p className="text-xs text-gray-500 mt-1">Maximum size to detect as a cell</p>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Circularity Threshold (0-1)
                                            </label>
                                            <input
                                                type="number"
                                                step="0.05"
                                                min="0"
                                                max="1"
                                                value={params.circularity_threshold}
                                                onChange={(e) => handleParamChange('circularity_threshold', e.target.value)}
                                                className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                            />
                                            <p className="text-xs text-gray-500 mt-1">Minimum circularity (1 = perfect circle)</p>
                                        </div>
                                    </div>

                                    <div className="mt-4 p-3 bg-blue-50 rounded-lg border border-blue-200">
                                        <p className="text-sm text-blue-800">
                                            💡 <strong>Tip:</strong> Changes to these parameters will be synced to all connected devices in real-time!
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Camera View */}
                        {isCameraMode && (
                            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">📷 Camera Preview</h2>
                                <div className="relative bg-black rounded-lg overflow-hidden" style={{ minHeight: '400px' }}>
                                    {!cameraReady && (
                                        <div className="absolute inset-0 flex items-center justify-center">
                                            <div className="text-center text-white">
                                                <div className="animate-spin text-6xl mb-4">⚙️</div>
                                                <p>Starting camera...</p>
                                            </div>
                                        </div>
                                    )}
                                    <video 
                                        ref={videoRef} 
                                        autoPlay 
                                        playsInline
                                        className="w-full h-auto rounded-lg"
                                        style={{ display: cameraReady ? 'block' : 'none' }}
                                    />
                                </div>
                                <div className="flex gap-4 mt-4">
                                    <button
                                        onClick={captureImage}
                                        disabled={!cameraReady}
                                        className={`flex-1 px-6 py-3 rounded-lg font-semibold transition ${
                                            cameraReady 
                                                ? 'bg-blue-600 text-white hover:bg-blue-700' 
                                                : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                        }`}
                                    >
                                        📸 {cameraReady ? 'Capture Image' : 'Waiting for camera...'}
                                    </button>
                                    <button
                                        onClick={stopCamera}
                                        className="px-6 py-3 bg-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-400 transition"
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Upload/Capture Options */}
                        {!isCameraMode && !currentImage && (
                            <div className="grid md:grid-cols-2 gap-4 mb-6">
                                <button
                                    onClick={startCamera}
                                    className="bg-white rounded-lg shadow-lg p-8 hover:shadow-xl transition flex flex-col items-center justify-center gap-4 group"
                                >
                                    <span className="text-6xl">📷</span>
                                    <div>
                                        <h3 className="text-xl font-bold text-gray-800">Capture Image</h3>
                                        <p className="text-gray-600 text-sm mt-1">Use device camera</p>
                                    </div>
                                </button>

                                <button
                                    onClick={() => fileInputRef.current?.click()}
                                    className="bg-white rounded-lg shadow-lg p-8 hover:shadow-xl transition flex flex-col items-center justify-center gap-4 group"
                                >
                                    <span className="text-6xl">📁</span>
                                    <div>
                                        <h3 className="text-xl font-bold text-gray-800">Upload Image</h3>
                                        <p className="text-gray-600 text-sm mt-1">Select from device</p>
                                    </div>
                                </button>
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    accept="image/*"
                                    onChange={handleFileUpload}
                                    className="hidden"
                                />
                            </div>
                        )}

                        {/* Analysis Display */}
                        {currentImage && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-xl font-bold text-gray-800">📸 Input Image</h2>
                                        <button
                                            onClick={clearAnalysis}
                                            className="text-red-600 hover:text-red-700 px-4 py-2 rounded-lg hover:bg-red-50 transition"
                                        >
                                            🗑️ Clear
                                        </button>
                                    </div>
                                    <img 
                                        src={currentImage} 
                                        alt="Cell sample" 
                                        className="w-full rounded-lg border-2 border-gray-200"
                                    />
                                </div>

                                <div className="grid md:grid-cols-2 gap-6">
                                    <div className="bg-white rounded-lg shadow-lg p-6">
                                        <h2 className="text-xl font-bold text-gray-800 mb-4">📊 Analysis Results</h2>
                                        
                                        {isAnalyzing ? (
                                            <div className="flex flex-col items-center justify-center h-64 gap-4">
                                                <div className="animate-spin text-6xl">⚙️</div>
                                                <p className="text-gray-600">Analyzing cells...</p>
                                                <p className="text-sm text-gray-500">This may take 30-60 seconds on first request</p>
                                            </div>
                                        ) : analysisResult ? (
                                            <div className="space-y-4">
                                                <div className="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-lg">
                                                    <p className="text-sm text-gray-600">Total Cells Detected</p>
                                                    <p className="text-3xl font-bold text-gray-800">{analysisResult.total_cells}</p>
                                                </div>

                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-green-50 p-4 rounded-lg border-2 border-green-200">
                                                        <p className="text-sm text-gray-600">Live Cells</p>
                                                        <p className="text-2xl font-bold text-green-700">{analysisResult.live_cells}</p>
                                                        <p className="text-xs text-gray-500">{analysisResult.live_percentage.toFixed(1)}%</p>
                                                    </div>

                                                    <div className="bg-red-50 p-4 rounded-lg border-2 border-red-200">
                                                        <p className="text-sm text-gray-600">Dead Cells</p>
                                                        <p className="text-2xl font-bold text-red-700">{analysisResult.dead_cells}</p>
                                                        <p className="text-xs text-gray-500">{analysisResult.dead_percentage.toFixed(1)}%</p>
                                                    </div>
                                                </div>

                                                <div className="bg-gradient-to-r from-purple-50 to-pink-50 p-6 rounded-lg border-2 border-purple-200">
                                                    <p className="text-sm text-gray-600 mb-1">Cell Viability</p>
                                                    <p className="text-4xl font-bold text-purple-700">{analysisResult.viability.toFixed(2)}%</p>
                                                </div>

                                                <div className="relative pt-4">
                                                    <div className="h-8 bg-gray-200 rounded-full overflow-hidden">
                                                        <div 
                                                            className="h-full bg-gradient-to-r from-green-500 to-green-600 transition-all duration-500"
                                                            style={{ width: `${analysisResult.live_percentage}%` }}
                                                        />
                                                    </div>
                                                    <div className="flex justify-between text-xs text-gray-600 mt-2">
                                                        <span>Dead</span>
                                                        <span>Live</span>
                                                    </div>
                                                </div>

                                                <button
                                                    onClick={downloadResults}
                                                    className="w-full bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition flex items-center justify-center gap-2"
                                                >
                                                    💾 Download Report
                                                </button>
                                            </div>
                                        ) : null}
                                    </div>

                                    <div className="bg-white rounded-lg shadow-lg p-6">
                                        <h2 className="text-xl font-bold text-gray-800 mb-4">🎨 Visualization</h2>
                                        
                                        {overlayImage && (
                                            <div className="space-y-4">
                                                <div>
                                                    <p className="text-sm text-gray-600 mb-2">Cell Detection Overlay</p>
                                                    <img 
                                                        src={overlayImage} 
                                                        alt="Detection overlay" 
                                                        className="w-full rounded-lg border-2 border-gray-200"
                                                    />
                                                </div>
                                            </div>
                                        )}
                                        
                                        {classificationImage && (
                                            <div className="mt-4">
                                                <p className="text-sm text-gray-600 mb-2">Live/Dead Classification</p>
                                                <img 
                                                    src={classificationImage} 
                                                    alt="Classification" 
                                                    className="w-full rounded-lg border-2 border-gray-200"
                                                />
                                            </div>
                                        )}
                                        
                                        {!overlayImage && !classificationImage && isAnalyzing && (
                                            <div className="flex items-center justify-center h-64 text-gray-400">
                                                <p>Generating visualizations...</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Footer */}
                        <div className="text-center text-gray-600 mt-8 pb-4">
                            <p className="text-sm">Cell Viability Analyzer v2.0 | Real-time Collaborative Analysis</p>
                        </div>
                    </div>

                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CellViabilityApp />);
    </script>
</body>
</html>
